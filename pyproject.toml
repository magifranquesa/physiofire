[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "physiofire"
version = "0.1.0"
description = "PHYSIOFIRE proof of concept: SIF/APAR anomalies as early indicators of wildfire danger"
requires-python = ">=3.11"
# Dependencies are managed by conda (environment.yml).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
