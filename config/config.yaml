# PHYSIOFIRE proof of concept configuration.
# Read from Python (physiofire.config.load_config) and R (R/config.R).
# Paths are relative to the repository root.

region:
  name: iberian_peninsula
  # Bounding box in degrees (EPSG:4326). Balearic and Canary Islands excluded.
  lon_min: -10.0
  lon_max: 4.5
  lat_min: 35.5
  lat_max: 44.5

period:
  start: "2018-05-01"   # start of TROPOMI SIF record
  end: null             # null = latest available; set explicitly once data are verified

grids:
  # Both grids are aligned with the region bounds (cell edges at multiples of the resolution).
  base:
    resolution_deg: 0.25  # as in Tang et al. (2026)
  fine:
    resolution_deg: 0.05  # finer TROPOMI gridding (to be verified)

troposif:
  stac_url: https://data-portal.s5p-pal.com/api/s5p-l2
  collection: L2B_SIF___      # daily, ungridded, already filtered to qa_value > 0.5
  subset_buffer_deg: 0.1      # keep pixels whose centre lies within region + buffer
  out_dir: data/raw/troposif/l2b_iberia
  tmp_dir: data/raw/troposif/_tmp
  manifest: data/raw/troposif/manifest.csv
  max_retries: 3

gee:
  project: ee-magifranquesa   # authentication: gcloud application-default credentials (see README)
  out_dir: data/interim/gee
  fetch_grid: fine            # GEE aggregates 500 m data to this grid; coarser grids are built locally
  max_pixels: 65535           # reduceResolution input pixels per output cell
  fpar:
    collection: MODIS/061/MCD15A3H
    scf_qc_max: 1             # FparLai_QC bits 5-7 (SCF_QC): 0/1 = main algorithm (to verify with MOD15 user guide)
    composite_center_days: 1.5  # 4-day composite: time_start + 1.5 d = centre
  nbar:
    collection: MODIS/061/MCD43A4   # MCD43C4 is not in the GEE catalogue; MCD43A4 (500 m) aggregated instead
    bands: {red: Nadir_Reflectance_Band1, nir: Nadir_Reflectance_Band2, blue: Nadir_Reflectance_Band3}
    max_mandatory_quality: 1  # 0 full BRDF inversion, 1 magnitude inversion
  landcover:
    collection: MODIS/061/MCD12C1
  boundaries:
    collection: USDOS/LSIB_SIMPLE/2017
    countries: [Spain, Portugal]   # mainland polygon of each kept (Balearics, Canaries, Azores, Madeira out)
  era5land:
    collection: ECMWF/ERA5_LAND/DAILY_AGGR
    sw_band: surface_solar_radiation_downwards_sum   # J m-2 per day
  burned:
    collection: MODIS/061/MCD64A1   # QC point screening; yearly burn history (fraction, first burn date)
  burn_history_years: [2013, 2025]  # 5 years before the TROPOMI record (2018) to the latest case
  # Daily surface reflectance, NOT BRDF-adjusted: main optical competitor in the epoch analysis.
  # state_1km bits (MOD09 user guide, to verify): 0-1 cloud state (0 clear), 2 cloud shadow, 3-5 land/water
  # (1 land), 6-7 aerosol quantity (3 high), 8-9 cirrus (0 none), 10 internal cloud, 13 adjacent to cloud,
  # 15 internal snow mask. QC_500m bits 0-1 MODLAND QA (0 ideal, 1 less than ideal).
  sr_bands: {red: sur_refl_b01, nir: sur_refl_b02, blue: sur_refl_b03}
  sr_max_sensor_zenith: 40
  mod09ga:
    collection: MODIS/061/MOD09GA   # Terra; overpass drifting earlier (~09:00 by late 2025)
  myd09ga:
    collection: MODIS/061/MYD09GA   # Aqua; overpass drifting later (~15:50 by Aug 2026)

# PAR source. PROVISIONAL: PAR = par_fraction x ERA5-Land daily downward shortwave (daily mean W m-2),
# until CERES SYN1deg Ed4B is downloaded and the April 2022 discontinuity test is done.
# par_fraction: PAR/global shortwave energy ratio; typical literature values 0.45-0.50 (reference to be
# added). A constant factor rescales SIF/APAR uniformly, so it does not change its temporal anomalies'
# sign or timing, but absolute SIF/APAR values are not comparable with Tang et al. (CERES PAR).
par:
  source: era5land_shortwave_fraction   # PROVISIONAL; alternatives: ceres_syn1deg_ed4b
  par_fraction: 0.48
  provisional: true
  ceres_jump_test_grid_deg: 1.0   # CERES SYN1deg native grid

# Parameters taken from Tang et al. (2026), Methods.
sif:
  wavelength_nm: 743
  variable: SIF_Corr_743     # day-length corrected SIF (as in Tang et al.)
  error_variable: SIF_ERROR_743
  min_quality: 0.5           # L2B already keeps only qa_value > 0.5 (see docs/data_sources.md)
  max_cloud_fraction: 0.5
  exclude_lc_classes: [15, 16]   # LC_MASK (MCD12C1 2018): 15 snow/ice, 16 barren
  footprint_subsamples: 4        # k x k sub-points per TROPOMI pixel for footprint-weighted gridding
  grid_dir: data/interim/troposif_grid
sif_apar:
  clip_percentiles: [1, 99]      # Tang et al. pooled filter: SENSITIVITY ONLY (epoch rule 4); ratios stored unfiltered
  min_land_fraction: 0.5         # cells used: at least this fraction inside mainland Spain + Portugal
  fpar_max_gap_days: 12          # max gap filled when interpolating 4-day fPAR composites to daily
  fpar_composite_days: 4         # MCD15A3H compositing period (start .. start+3)
  fpar_persist_days: 5           # epoch analysis: carry last valid composite forward at most this many days
  screening:                     # applied in the anomaly stage, after post-fire masking [TODO thresholds]
    fpar_min: null
    par_min: null
    sif_weight_min: null
    robust_k_mad: null
  out_dir: data/processed
anomalies:
  loess_frac: 0.4          # LOESS window as fraction of the period
  smooth_days: 15
  smooth_pixels: 3         # 3 x 3 spatial window
  alternative: median      # alternative anomaly against the period median (short climatology)

epoch:
  window_days: 60          # days before fire start date

# Generic QC points for the task 4 chain check (NOT fire locations). Rule fixed before looking at series.
# IGBP classes from MCD12C1 (provisional: contrast with CORINE / WorldCover pending, IGBP can confuse
# Mediterranean shrubland and woodland; woody savannas (8) deliberately excluded).
qc_points:
  grid: base
  landcover_year: 2024
  min_land_fraction: 0.95
  burned_period: ["2025-01-01", "2025-09-30"]   # MCD64A1; cell and its 8 neighbours must be unburned
  classes:
    woodland:  {igbp: [1, 2, 3, 4, 5], min_percent: 60}
    shrubland: {igbp: [6, 7], min_percent: 50}
  n_per_class: 3
  min_separation_deg: 2.0
  rolling_days: 15          # smoothing window for the series plots (as in Tang et al.)

sample_period:            # task 4: end-to-end SIF/APAR chain test (60-day window before mid-August fires + margin)
  start: "2025-06-01"
  end: "2025-09-07"

fires:
  first_case_year: 2025
  candidate_years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]

# Selection criteria: to be fixed (and documented in docs/fire_selection_criteria.md)
# BEFORE looking at SIF/APAR. null = pending decision.
fire_selection:
  min_area_ha: null
  min_pixel_fraction_base: null
  min_pixel_fraction_fine: null
  min_date_sources: 2
  min_dominant_vegetation_fraction: null
  overlap_exclusion_days: 60
  firms_match_buffer_m: null
  firms_match_max_days: null

random_seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  fires: data/fires
  figures: figures
