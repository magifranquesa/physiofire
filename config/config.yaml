# PHYSIOFIRE proof of concept configuration.
# Read from Python (physiofire.config.load_config) and R (R/config.R).
# Paths are relative to the repository root.

region:
  name: iberian_peninsula
  # Bounding box in degrees (EPSG:4326). Balearic and Canary Islands excluded.
  lon_min: -10.0
  lon_max: 4.5
  lat_min: 35.5
  lat_max: 44.5

period:
  start: "2018-05-01"   # start of TROPOMI SIF record
  end: null             # null = latest available; set explicitly once data are verified

grids:
  # Both grids are aligned with the region bounds (cell edges at multiples of the resolution).
  base:
    resolution_deg: 0.25  # as in Tang et al. (2026)
  fine:
    resolution_deg: 0.05  # finer TROPOMI gridding (to be verified)

troposif:
  stac_url: https://data-portal.s5p-pal.com/api/s5p-l2
  collection: L2B_SIF___      # daily, ungridded, already filtered to qa_value > 0.5
  subset_buffer_deg: 0.1      # keep pixels whose centre lies within region + buffer
  out_dir: data/raw/troposif/l2b_iberia
  tmp_dir: data/raw/troposif/_tmp
  manifest: data/raw/troposif/manifest.csv
  max_retries: 3

gee:
  project: ee-magifranquesa   # authentication: gcloud application-default credentials (see README)
  out_dir: data/interim/gee
  fetch_grid: fine            # GEE aggregates 500 m data to this grid; coarser grids are built locally
  max_pixels: 65535           # reduceResolution input pixels per output cell
  fpar:
    collection: MODIS/061/MCD15A3H   # MAIN fPAR source (4-day, as in Tang et al.)
    scf_bit_start: 5          # FparLai_QC bits 5-7 = SCF_QC (to verify with MOD15 user guide)
    scf_qc_max: 1             # 0/1 = main (RT) algorithm
    scale: 0.01               # GEE asset stores integers 0-100 (+ fill 249-255): scale applied here
    valid_max_raw: 100        # valid range in asset units (before scaling)
    composite_days: 4
    composite_center_days: 1.5  # 4-day composite: time_start + 1.5 d = centre
    # FparExtra_QC masks (MOD15 C6.1 User Guide, Table 5 "FparExtra_QC"): keep pixel only if value <= max
    extra_qc:
      - {name: cloud, bit: 5, nbits: 1, max: 0}     # Internal_CloudMask
      - {name: cirrus, bit: 4, nbits: 1, max: 0}
      - {name: cloud_shadow, bit: 6, nbits: 1, max: 0}
    # Aerosol bit NOT applied as a mask (MODIS lumps average and high): stored as per-cell fraction (smoke flag)
    aerosol_flag: {bit: 3, nbits: 1, min: 1}        # 1 = average or high aerosol
    # FparLai_QC masks: MOD09 cloud state inherited in bits 3-4 (MOD15 C6.1 User Guide, Table 5 "FparLai_QC"):
    # 0 clear, 1 significant clouds, 2 mixed, 3 not defined (assumed clear). Values listed in `exclude` removed.
    lai_qc_exclude:
      - {name: mod09_cloud_state, bit: 3, nbits: 2, exclude: [1, 2]}
  fpar_viirs:
    collection: NASA/VIIRS/002/VNP15A2H   # SENSITIVITY fPAR source (8-day, S-NPP, collection 2)
    scf_bit_start: 0          # VIIRS: SCF_QC is bits 0-2 (VNP15 User Guide v1.1, Table 4), NOT 5-7 as in MODIS
    scf_qc_max: 1             # 0/1 = main (RT) algorithm
    scale: 1.0                # ASSET IS PRE-SCALED by GEE (double 0-2.55; fill 249-255 -> 2.49-2.55): no factor
    valid_max_raw: 1.0        # valid range in asset units: Fpar <= 1.0 excludes fill values
    composite_days: 8
    composite_center_days: 3.5  # 8-day composite: time_start + 3.5 d = centre
    # FparExtra_QC masks (VNP15 User Guide v1.1, Table 5): bit positions differ from MODIS
    extra_qc:
      - {name: cloud, bit: 0, nbits: 2, max: 1}     # 0 confident clear, 1 probably clear (kept); 2-3 cloudy
      - {name: cloud_shadow, bit: 2, nbits: 1, max: 0}
      - {name: cirrus, bit: 3, nbits: 1, max: 0}
    aerosol_flag: {bit: 4, nbits: 2, min: 3}        # 3 = high aerosol (not applied as mask)
  # Plausible range of the MEDIAN of each fetched image (valid cells). Catches scaling errors only;
  # the fetch stops with an error naming product and date if a median falls outside.
  plausible_median:
    fpar: [0.05, 0.95]
    red: [0.01, 0.40]
    nir: [0.05, 0.60]
    blue: [0.005, 0.30]
  series_rejection:           # full-series download: an image failing plausible_median is logged and excluded;
    log_file: rejected_images.csv   # (in the series folder) the run stops only on a systematic problem:
    max_consecutive: 3        # this many rejected images in a row (likely scaling), or
    max_per_year: 5           # more than this many in one product-year
  nbar:
    collection: MODIS/061/MCD43A4   # MCD43C4 is not in the GEE catalogue; MCD43A4 (500 m) aggregated instead
    bands: {red: Nadir_Reflectance_Band1, nir: Nadir_Reflectance_Band2, blue: Nadir_Reflectance_Band3}
    max_mandatory_quality: 1  # 0 full BRDF inversion, 1 magnitude inversion
  landcover:
    collection: MODIS/061/MCD12C1
  boundaries:
    collection: USDOS/LSIB_SIMPLE/2017
    countries: [Spain, Portugal]   # mainland polygon of each kept (Balearics, Canaries, Azores, Madeira out)
  era5land:
    collection: ECMWF/ERA5_LAND/DAILY_AGGR
    sw_band: surface_solar_radiation_downwards_sum   # J m-2 per day
  burned:
    collection: MODIS/061/MCD64A1   # QC point screening; yearly burn history (fraction, first burn date)
  burn_date_products:               # monthly burned area, per-pixel burn date (day of year) for ignition dating
    mcd64a1: {collection: MODIS/061/MCD64A1, date_band: BurnDate, uncertainty_band: Uncertainty}
    vnp64a1: {collection: NASA/VIIRS/002/VNP64A1, date_band: Burn_Date, uncertainty_band: Burn_Date_Uncertainty}
  burn_date_res_deg: 0.005          # ~500 m native, nearest-neighbour on a lat/lon grid (no aggregation)
  burn_history_years: [2013, 2025]  # 5 years before the TROPOMI record (2018) to the latest case
  # Daily surface reflectance, NOT BRDF-adjusted: main optical competitor in the epoch analysis.
  # state_1km bits (MOD09 user guide, to verify): 0-1 cloud state (0 clear), 2 cloud shadow, 3-5 land/water
  # (1 land), 6-7 aerosol quantity (3 high), 8-9 cirrus (0 none), 10 internal cloud, 13 adjacent to cloud,
  # 15 internal snow mask. QC_500m bits 0-1 MODLAND QA (0 ideal, 1 less than ideal).
  sr_bands: {red: sur_refl_b01, nir: sur_refl_b02, blue: sur_refl_b03}
  sr_max_sensor_zenith: 40
  sr_reject_negative: true    # MOD09GA/MYD09GA: drop 500 m pixels with negative reflectance in any band
  sr_max_negative_fraction: 0.10   # reject the whole image if more screened pixels than this are negative
  sr_negative_min_pixels: 10000    # ... and it has at least this many screened 500 m pixels (~2500 km2)
                                   # 2018-2026: only Terra 2025-03-29 (24.7%); next largest with coverage 4.6%
  mod09ga:
    collection: MODIS/061/MOD09GA   # Terra; overpass drifting earlier (~09:00 by late 2025)
  myd09ga:
    collection: MODIS/061/MYD09GA   # Aqua; overpass drifting later (~15:50 by Aug 2026)

# PAR source (main analysis, 7 November 2026): PAR = par_fraction x ERA5-Land daily downward shortwave (daily mean
# W m-2): homogeneous record over the whole period and low latency. CERES SYN1deg Ed4B (April 2022 change of inputs,
# ends 31 August 2026) is a sensitivity analysis (backlog 3, R12).
# par_fraction: PAR/global shortwave energy ratio; typical literature values 0.45-0.50 (reference to be
# added). A constant factor rescales SIF/APAR uniformly, so it does not change its standardised anomalies.
par:
  source: era5land_shortwave_fraction   # sensitivity: ceres_syn1deg_ed4b
  par_fraction: 0.48
  provisional: false
  ceres_jump_test_grid_deg: 1.0   # CERES SYN1deg native grid

# Parameters taken from Tang et al. (2026), Methods.
sif:
  wavelength_nm: 743
  variable: SIF_Corr_743     # day-length corrected SIF (as in Tang et al.)
  error_variable: SIF_ERROR_743
  min_quality: 0.5           # L2B already keeps only qa_value > 0.5 (see docs/data_sources.md)
  max_cloud_fraction: 0.5
  exclude_lc_classes: [15, 16]   # LC_MASK (MCD12C1 2018): 15 snow/ice, 16 barren
  footprint_subsamples: 4        # k x k sub-points per TROPOMI pixel for footprint-weighted gridding
  grid_dir: data/interim/troposif_grid
sif_apar:
  clip_percentiles: [1, 99]      # Tang et al. pooled filter: SENSITIVITY ONLY (epoch rule 4); ratios stored unfiltered
  min_land_fraction: 0.5         # cells used: at least this fraction inside mainland Spain + Portugal
  fpar_max_gap_days: 12          # max gap filled when interpolating 4-day fPAR composites to daily
  fpar_composite_days: 4         # MCD15A3H compositing period (start .. start+3)
  fpar_persist_days: 5           # epoch analysis (MCD15A3H): carry last valid composite forward at most this many days
  fpar_viirs_max_gap_days: 16    # VNP15A2H 8-day composites: bridge one missing composite
  fpar_viirs_persist_days: 11    # epoch analysis (VNP15A2H): covers day -1 in the worst case (centre 10.5 d before)
  # Persistence biases SIF/APAR LOW if structure declines before ignition (stale, too-high fPAR): same direction
  # as the signal sought. The NO-PERSISTENCE run is the reference for validating any lead time.
  fpar_persist_sensitivity: {modis: [null], viirs: [8, null]}
  screening:                     # input validity of SIF/APAR (approved 2026-11-08, before any fire series was extracted).
                                 # Derived on 1462 unburned shrubland/heathland cells outside the analysis
                                 # (python -m physiofire.screening_thresholds --classes shrubland wet_heath): below
                                 # each threshold the relative noise exceeds 2x that of well-conditioned data.
    fpar_min: 0.15               # removes 0.7 % of summer cell-days (sensitivity R20: no fPAR threshold)
    par_min: 40.0                # W m-2; removes 0 % in summer (winter days)
    sif_weight_min: 0.1          # TROPOSIF equivalent full pixels in the cell; removes 1.3 % in summer
  out_dir: data/processed
anomalies:
  loess_frac: 0.4          # LOESS window as fraction of the (valid) observations (span used by Tang et al.)
  loess_delta_days: 10     # statsmodels lowess `delta` (speed-up: linear interpolation between fits)
  loess_min_obs: 365       # cells with fewer valid observations get no LOESS anomaly
  loess_deseasonalize_first: true   # trend fitted on the deseasonalised series (one STL-like iteration). With the
                           # series cut at ignition the epoch window is at the series END, where the LOESS fit of the
                           # raw series absorbs part of the seasonal cycle: synthetic controls biased by -0.3 to -0.4
                           # noise SD without this. false = Tang et al. original
  clim_doy_window: 15      # seasonal cycle / DOY median pooled over DOY +- this many days, across years
  smooth_days: 15          # descriptive maps only (centred); epoch analysis uses trailing windows
  smooth_pixels: 3         # 3 x 3 spatial window, descriptive maps only
  trailing_days: [15, 7]   # epoch analysis: trailing windows ending on the evaluated day (15 main, 7 sensitivity)
  trailing_min_frac: 0.5   # minimum fraction of valid days in a trailing window
  # Isolated-spike filter (Hampel type), applied after post-fire masking: residual to the running median of the
  # cell's own series (+- half_window days) > k x robust noise scale of the cell -> removed. Persistent drops move
  # the running median too, so they are kept.
  spike_half_window: 3
  spike_k: 6               # approved 2026-11-08: removes 0.7 % of valid SIF/APAR cell-days (backlog 39: k = 4, 8)
  spike_min_neighbours: 3
  methods: [median_doy, loess]   # epoch analysis: median_doy MAIN, loess SENSITIVITY (epoch.series)

epoch:
  # Simplified analysis of the 2025 case (manually selected fires; data/fires/selected_fires.csv).
  # Thresholds DECIDED BEFORE THE ANALYSIS (7 November 2026), before any vegetation or meteorological series was
  # extracted for the fires.
  window_days: 60          # days before ignition (day 0 = ignition date; days -60 .. -1 analysed)
  grids: [fine]            # 0.05 deg is the main (only) scale of the proof of concept; 0.25 deg -> backlog
  selected_fires: data/fires/selected_fires.csv   # columns: fire_id (= EFFIS id), ignition_date, ... (R/select_fires.R)
  selection:               # fire sample by rule (decided 2026-11-07; replaces the manual selection)
    strata: [shrubland]    # woodland -> full analysis (only 2 of 5 woodland fires had controls in 2025)
    rule: "shortlist (EFFIS > 2000 ha); stratum shrubland; valid ignition date; no coherence flag; >= 3 controls"
    # General exclusion (decided 2026-11-07): ignition more than this many days before the EFFIS FIREDATE without
    # independent confirmation. The satellite dates (VIIRS, MCD64A1, VNP64A1) are searched inside the same EFFIS
    # perimeter, so they cannot rule out a merged perimeter or an earlier fire inside it; confirmation needs an
    # independent record (e.g. EGIF, ICNF, ESFire30 MODIS-dated perimeters), which is not implemented: all such
    # fires are excluded (exclude = TRUE, reason below).
    max_days_before_effis: 7
    early_ignition_reason: "Ignición > 7 días antes de EFFIS sin confirmación independiente: ventana previa posiblemente desalineada"
  burned_min_fraction: {fine: 0.25}               # burned cell: fraction of the cell inside the perimeter
  prior_burn:              # decided 2026-11-07: burned cells with post-fire recovery are removed (fire kept if cells remain;
    years: 5               # otherwise excluded): >= min_fraction of the cell burned in any of the `years` years before
    min_fraction: 0.25     # the fire year by MCD64A1, VNP64A1, EFFIS perimeters or ESFire30 (Spain)
  controls:                # per fire, compared with the (burned-fraction weighted) mean of its burned cells
    n_min: 3               # fewer valid candidates -> fire reported without controls (no relaxation)
    n_max: 5
    min_dist_km: 10        # nearest point of the CELL to the perimeter: whole cell outside the immediate strip
    max_dist_km: 50        # cell centre to the perimeter
    unburned_since: 2017   # no burn in any year from this one to the fire year, by any of: EFFIS perimeters,
                           # MCD64A1, VNP64A1 (yearly burn history) and ESFire30 perimeters (Spain only) ...
    max_burned_fraction: {fine: 0.0}   # ... above this fraction of the cell (0 = not a single burned pixel)
    min_land_fraction: 0.5
    max_aridity_rel_diff: 0.15   # |AI_control - AI_burned| / AI_burned (Global-AI v3.1, P / ET0); decided 2026-11-07
                                 # (replaces the absolute +-0.1, too tight in the humid NW and too loose in arid areas)
    max_elevation_diff_m: 200    # |elevation_control - elevation_burned| (SRTM 90 m cell mean)
    vegetation: fuel             # dominant class used for matching and strata: fuel (epoch.fuel.classes, FirEUrisk,
                                 # main) or corine (epoch.corine.groups, support)
  esfire30:                # Landsat 30 m annual burned-area perimeters, peninsular Spain (Ochoa et al.; CC BY 4.0)
    doi: 10.5281/zenodo.20257001
    raw_dir: data/raw/esfire30/zenodo_20257001
    annual: a/ESFire30_1985_2025/BA_{year}.shp           # annual perimeters (field area_ha / value1)
    dated: b/ESFire30_2001_2025/burned_areas_{year}_MODIS.shp   # MODIS date-corrected (date, julian_day, area_ha)
  corine:                  # CORINE Land Cover 2018 (100 m), fraction of each group per cell (GEE, area mean)
    collection: COPERNICUS/CORINE/V20/100m/2018
    band: landcover
    year: 2018
    groups:                # level-3 codes (all 44 assigned); dominant group = largest fraction of the cell
      broadleaved: [311]
      coniferous: [312]
      mixed_forest: [313]
      natural_grassland: [321]
      heathland: [322]       # moors and heathland
      sclerophyllous: [323]  # sclerophyllous vegetation
      transitional: [324]    # transitional woodland-shrub
      sparse_vegetation: [331, 332, 333]   # beaches/dunes, bare rock, sparsely vegetated areas
      burnt_areas: [334]
      agricultural: [211, 212, 213, 221, 222, 223, 231, 241, 242]   # arable, permanent crops, pastures, complex
      agri_natural_mosaic: [243]   # agriculture with significant areas of natural vegetation
      agroforestry: [244]          # agro-forestry areas (dehesas, montados)
      artificial: [111, 112, 121, 122, 123, 124, 131, 132, 133, 141, 142]
      water_wetland: [335, 411, 412, 421, 422, 423, 511, 512, 521, 522, 523]
  fuel:                    # FirEUrisk European fuel map (main vegetation classification; python -m physiofire.preprocess.fuel)
    source: FirEUrisk European fuel map v2.0, first-level fuel types, 1 km, EPSG:3035, circa 2019 (Aragoneses et al. 2023)
    doi: 10.21950/YABYCN   # e-cienciaDatos, CC BY 4.0; legend in the Product User Manual (Table 1)
    file: data/raw/fireurisk_fuel/yabycn_v2/FirEUrisk_Europe_fuel_map.tif
    out_dir: data/interim/static
    subsamples: 4          # k x k sub-points per 1 km pixel when assigning area to 0.05 deg cells
    types: [1121, 1122, 1211, 1212, 1301, 1302, 21, 22, 23, 31, 32, 33, 41, 42, 51, 52, 53, 61, 62, 7]
    # 1121/1122 broadleaf deciduous open/closed, 1211/1212 needleleaf evergreen open/closed, 1301/1302 mixed
    # open/closed (open = canopy cover 15-70 %, closed = 70-100 %); 21-23 shrubland, fuel depth low/medium/high;
    # 31-33 grassland, low/medium/high; 41 herbaceous and 42 woody cropland; 51-53 wet and peat/semi-peat land
    # (tree, shrubland, grassland); 61-62 urban; 7 nonfuel (water, snow, bare soil, sparse vegetation; also sea).
    # Broadleaf evergreen forest (1111/1112) is not mapped in the European product.
    classes:               # proposed 2026-11-07; dominant class = largest fraction of the cell
      closed_forest: [1122, 1212, 1302]
      open_forest: [1121, 1211, 1301]
      shrubland: [21, 22, 23]
      wet_heath: [51, 52, 53]
      grassland: [31, 32, 33]
      cropland: [41, 42]
      nonfuel: [61, 62, 7]
  strata:                  # analysis strata (results by vegetation) from the fire's dominant class, per source
    fuel:
      woodland: [closed_forest, open_forest]
      shrubland: [shrubland, wet_heath]
      grassland: [grassland]           # negative control (cured grass = dead fuel)
    corine:
      woodland: [broadleaved, coniferous, mixed_forest]
      shrubland: [heathland, sclerophyllous, transitional]
      grassland: [natural_grassland]
  static:
    dem: CGIAR/SRTM90_V4    # 90 m (SRTM 30 m exceeds GEE user memory for the area mean)
    era5land_monthly: ECMWF/ERA5_LAND/MONTHLY_AGGR   # superseded aridity (P/PET, PET overestimated): not used
    aridity_years: [1991, 2020]
    aridity:               # Global Aridity Index v3.1 (python -m physiofire.preprocess.aridity)
      source: Global-AI_PET v3.1 annual aridity index (Zomer & Trabucco), 1970-2000, 30 arc-seconds
      doi: 10.6084/m9.figshare.7504448.v7   # v3.1 (2025-07-17); v5 = v3, with the ET0 error corrected in v3.1
      file: data/raw/global_ai/figshare_7504448_v7/Global-AI_ET0__annual_v3_1/ai_v31_yr.tif
      scale: 0.0001
      invalid_values: [0, 65535]
      out_dir: data/interim/static
  # Anomaly series used (from anomalies.compute) and standardisation: each cell's anomaly is divided by its own SD
  # over the days before the epoch window (pre-ignition data only), so variables share units (SD).
  # MAIN: median by day of year. SENSITIVITY: LOESS with the trend fitted only on data before day -60 (see
  # epoch.loess_trend_end_day) on the deseasonalised series.
  series: [median_doy_trail15, loess_trail15]
  main_series: median_doy_trail15
  loess_trend_end_day: -60 # LOESS trend estimated with data before this day; held at its last value afterwards
  fpar_persist_days: 5     # SIF/APAR in the epoch: MODIS persistence (null = no persistence: reference run)
  expected_sign: {sif_apar: -1, ndvi: -1, evi: -1, fwi: 1, aed: 1}   # direction of the pre-fire signal; suffixed
                           # variables (sif_apar_nopersist, ndvi_terra, evi_nbar, ...) take the sign of their base name
  # Optical competitor (decided 2026-11-07): MAIN ndvi/evi = Terra + Aqua combined (mean of MOD09GA and MYD09GA when
  # both are valid, the valid one otherwise; ~1 value every 1.6 days). SENSITIVITY: each platform and NBAR (MCD43A4).
  optical_sensitivity: true
  cutoff_offset_days: {ndvi_nbar: -8, evi_nbar: -8}   # NBAR uses observations up to t+7: masked from day -8
  # Isolated-spike filter only for satellite retrievals (noise); FWI and AED are meteorological (not filtered).
  spike_filter_variables: [sif_apar, ndvi, evi]
  effect_threshold_sd: 0.5 # lead time: earliest day from which the effect stays beyond this, in the expected sign
  bootstrap_n: 2000        # fire-level bootstrap for confidence intervals
  ci_level: 0.95
  out_dir: data/processed/epoch

# Generic QC points for the task 4 chain check (NOT fire locations). Rule fixed before looking at series.
# IGBP classes from MCD12C1 (provisional: contrast with CORINE / WorldCover pending, IGBP can confuse
# Mediterranean shrubland and woodland; woody savannas (8) deliberately excluded).
qc_points:
  grid: base
  landcover_year: 2024
  min_land_fraction: 0.95
  burned_period: ["2025-01-01", "2025-09-30"]   # MCD64A1; cell and its 8 neighbours must be unburned
  classes:
    woodland:  {igbp: [1, 2, 3, 4, 5], min_percent: 60}
    shrubland: {igbp: [6, 7], min_percent: 50}
  n_per_class: 3
  min_separation_deg: 2.0
  rolling_days: 15          # smoothing window for the series plots (as in Tang et al.)

sample_period:            # task 4: end-to-end SIF/APAR chain test (60-day window before mid-August fires + margin)
  start: "2025-06-01"
  end: "2025-09-07"

fires:
  first_case_year: 2025
  candidate_years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]

# Active-fire detections (FIRMS archive download, one request per country; see docs/data_sources.md)
firms:
  raw_dir: data/raw/firms              # {spain,portugal}/DL_FIRE_{source}_{id}/fire_{archive,nrt}_*.csv
  out_dir: data/interim/firms
  viirs_sources: [SV-C2, J1V-C2, J2V-C2]   # S-NPP, NOAA-20, NOAA-21 (375 m)
  modis_source: M-C61                  # MODIS C6.1 (1 km), backup only
  keep_type: 0                         # standard archive: 0 = presumed vegetation fire (2 = static land source, 3 = offshore)
  viirs_drop_confidence: [l]           # VIIRS classes l/n/h: drop low only (high-only = sensitivity test, backlog)
  modis_min_confidence: 30             # MODIS 0-100: < 30 = low
  static_type: 2                       # NRT files have no 'type': mask built from archive type-2 detections ...
  static_buffer_m_viirs: 500           # ... buffered by this distance for VIIRS NRT detections
  static_buffer_m_modis: 1000          # ... and this for MODIS NRT detections
  peninsula_mask: data/interim/gee/mask_peninsula_fine.nc   # land_fraction > 0 keeps mainland cells (islands out)

# EFFIS burnt area perimeters (public "real-time updated" database, MODIS 250 m, fires of ~30 ha or more)
effis:
  url: https://forest-fire.emergency.copernicus.eu/downloads/data.request.form/effis_layer.zip
  raw_dir: data/raw/effis/20261107     # download date (database is updated twice a day)
  layer: effis_layer/modis.ba.poly.shp
  countries: [ES, PT]
  years: [2018, 2026]
  out_dir: data/interim/fires

# Ignition date of each perimeter (R/fire_candidates.R). A late date is the dangerous error (post-ignition data
# would enter the pre-fire window), so ignition = EARLIEST of: EFFIS FIREDATE, first VIIRS detection (cleaned
# FIRMS), first MCD64A1 and first VNP64A1 burn date, each inside the perimeter and within
# [FIREDATE - ignition_window_before_days, FINALDATE + ignition_window_after_days].
# Coherence flag (exclude in principle): any VIIRS detection or MCD64A1/VNP64A1 burn date inside the perimeter in
# [FIREDATE - prior_lookback_days, FIREDATE - ignition_window_before_days) = possible merged perimeters or earlier
# fire. prior_lookback_days = 30 + 60-day epoch window, so the whole pre-ignition window is checked.
ignition:
  sources: [effis, viirs, mcd64a1, vnp64a1]
  ignition_window_before_days: 30
  ignition_window_after_days: 1
  prior_lookback_days: 90
  review_early_days: 3       # marker only (manual review): ignition more than this many days before FIREDATE
  burn_date_dir: data/interim/gee/burndate   # {product}_burndate_*.nc (python -m physiofire.download.gee burn_dates)

# Short list for the manual selection of the 2025 case (R/fire_shortlist.R -> docs/fire_shortlist_2025.md).
# Vegetation from the FirEUrisk fuel map (epoch.fuel, main) and CORINE 2018 (epoch.corine, support) on the 0.05 deg
# grid; MCD12C1 is no longer used for vegetation.
shortlist:
  min_area_ha: 2000

# Selection criteria: to be fixed (and documented in docs/fire_selection_criteria.md)
# BEFORE looking at SIF/APAR. null = pending decision.
fire_selection:
  min_area_ha: null
  min_pixel_fraction_base: null
  min_pixel_fraction_fine: null
  min_date_sources: 2
  min_dominant_vegetation_fraction: null
  overlap_exclusion_days: 60
  firms_match_buffer_m: null
  firms_match_max_days: null

# Fire Weather Index of the MAIN analysis (decided 2026-11-07): Canadian FWI System (xclim.compute.fire.cffwis_indices,
# xclim 1.0.0; follows the official CFS R code, cross-checked against the R package cffdrs) from ERA5-Land hourly
# on its native 0.1 deg grid (cell centres at multiples of 0.1 deg; no resampling).
# Inputs (daily): temperature, relative humidity (from the 2 m dew point) and 10 m wind speed at noon_utc_hour; 24 h
# precipitation = sum of the hourly images T(noon+1) of day d-1 .. T(noon) of day d (GEE `_hourly` bands hold the
# amount of the hour ENDING at the image time; checked on 2025-03-05/06).
# Continuous calculation from `start` with the standard start-up codes (FFMC 85, DMC 6, DC 15), no fire-season
# start-up/shutdown and no overwintering. The CEMS FWI (EWDS) is the operational reference and a sensitivity test.
fwi:
  collection: ECMWF/ERA5_LAND/HOURLY
  bands:
    tas: temperature_2m                   # K
    tdew: dewpoint_temperature_2m         # K
    u10: u_component_of_wind_10m          # m s-1
    v10: v_component_of_wind_10m          # m s-1
    pr_hourly: total_precipitation_hourly # m, hour ending at the image time
  noon_utc_hour: 12        # local solar noon in the region: 11:42 (4.5 E) to 12:40 (10 W) UTC
  start: "2017-01-01"      # spin-up of ~16 months before the TROPOMI record
  native_res_deg: 0.1
  inputs_dir: data/interim/era5land_fwi    # monthly input files fwi_inputs_YYYYMM.nc
  out_dir: data/interim/era5land_fwi
  cems:                    # operational reference (sensitivity R17)
    url: https://ewds.climate.copernicus.eu/api
    dataset: cems-fire-historical-v1
    product_type: reanalysis
    dataset_type: [consolidated_dataset, intermediate_dataset]   # tried in this order
    system_version: "4_1"
    grid: "0.25/0.25"
    raw_dir: data/raw/cems_fwi

# Atmospheric evaporative demand (decided 2026-11-07): FAO-56 Penman-Monteith reference evapotranspiration (ET0,
# short grass) from ERA5-Land daily fields on the native 0.1 deg grid (same source and grid as the FWI and PAR).
# GLEAM v4.3a Ep (Penman, 0.1 deg, 1980-2024) as a check for 2018-2024 (backlog). An AED from the IPE group would
# be assessed if provided.
aed:
  daily_collection: ECMWF/ERA5_LAND/DAILY_AGGR
  hourly_collection: ECMWF/ERA5_LAND/HOURLY   # wind speed (mean of hourly speeds)
  bands:
    tmax: temperature_2m_max
    tmin: temperature_2m_min
    tdew: dewpoint_temperature_2m              # daily mean dew point -> actual vapour pressure (FAO-56 Eq. 14)
    rs: surface_solar_radiation_downwards_sum  # J m-2 day-1
    ps: surface_pressure                       # Pa, daily mean -> psychrometric constant
    u10: u_component_of_wind_10m
    v10: v_component_of_wind_10m
  albedo: 0.23             # FAO-56 reference grass
  start: "2017-01-01"
  inputs_dir: data/interim/era5land_aed
  out_dir: data/interim/era5land_aed

# Question 1 (pre-registered 2026-11-08; docs/plan_q1_drought.md): does SIF/APAR respond to water stress at shorter
# time-scales and earlier than NDVI/EVI in Iberian natural vegetation, independently of fires? Fixed before any
# reference download, SPEI or series extraction; no parameter changes after results (post-hoc = additional analysis).
drought_q1:
  period: ["2018-05-01", "2025-12-31"]
  cells:
    grid: fine
    min_land_fraction: 0.5
    fuel_classes: [closed_forest, open_forest, shrubland, wet_heath, grassland]   # dominant FirEUrisk class
    unburned_since: 2013   # any burned area since this year by MCD64A1, VNP64A1, EFFIS (from 2018) or ESFire30 -> out
  strata:
    shrubland: [shrubland, wet_heath]   # DECIDES the result; wet_heath also reported alone (descriptive)
    forest: [closed_forest, open_forest]   # reported in the same detail, does not decide
    grassland: [grassland]               # reference
  aridity_classes: {semiarid: [0.0, 0.5], dry_subhumid: [0.5, 0.65], humid: [0.65, 100]}   # Global-AI v3.1
  vegetation:
    main: [sif_apar, ndvi, evi]        # ndvi/evi = Terra + Aqua combined
    secondary: [sif, sif_par, fpar]    # descriptive only
    fpar_interpolation: centred        # linear between composites, no persistence (no cut-off date here)
    screening: same_as_sif_apar        # sif_apar.screening (fPAR >= 0.15, PAR >= 40, weight >= 0.1) and spike_k = 6
  anomalies:
    method: median_doy                 # +- anomalies.clim_doy_window days, climatology 2018-2025
    smooth_days: 15                    # centred mean, same for all variables
    smooth_min_frac: 0.5
    standardise: whole_period_sd       # SD of the smoothed anomaly of each cell over the whole period
  spei:
    scales_days: [15, 30, 60, 90, 180, 365]
    reference: [1991, 2020]
    distribution: log-logistic         # unbiased PWM; one fit per day of year; 29 February removed
    package: SPEI 1.8.1 (R, CRAN)      # checked on synthetic data before use (R/tests/test_spei.R)
    clip: 3.09                         # decided 2026-11-08 (before any correlation): every SPEI value is clipped to
                                       # [-3.09, +3.09] (p = 0.001 per tail): +-Inf (outside the support of the fitted
                                       # log-logistic) and finite values beyond alike, keeping the ordering. First
                                       # version clipped only +-Inf (corrected before extracting series). Clipped values
                                       # per scale and cell, infinite and finite separately: spei_q1_clamped.csv
    grid: native_era5land_0.1          # 0.05 deg cells take the containing 0.1 deg cell
    precip_source: ECMWF/ERA5_LAND/HOURLY total_precipitation_hourly   # sum of the 24 hours of the UTC day
    et0: fao56_era5land                # physiofire.preprocess.aed
    precip_dir: data/interim/era5land_precip
    out_dir: data/interim/spei
  aed_secondary: true                  # AED (ET0) anomaly as secondary explanatory variable in analysis 1
  analysis1:
    months: [4, 5, 6, 7, 8, 9, 10]     # vegetation day t in April-October; all years pooled
    lags_days: [0, 60]
    correlation: pearson
    permutations: 199                  # whole-year permutation of the vegetation series; max over scales x lags
    alpha: 0.05
    h1_min_fraction: 0.60              # SIF/APAR scale shorter (strictly) than NDVI and than EVI
    h1_ties_count_as_shorter: false
    h2_scale_days: 90
    h2_max_median_lag_diff_days: -5    # median L(SIF/APAR) - L(NDVI or EVI) <= -5, CI entirely below 0
    bootstrap_block_deg: 1.0
  analysis2:
    spei_scale_days: 90
    onset_threshold: -1.0
    min_duration_days: 30
    pre_days: 60
    pre_threshold: -0.5
    onset_months: [3, 4, 5, 6, 7, 8, 9]
    response_window_days: [-30, 90]    # relative to onset (decided 2026-11-08: responses before the SPEI-90 crossing)
    response_threshold_sd: -0.5
    response_min_days: 15
    event_max_onset_gap_days: 15       # 8-neighbour connected cells with onsets within +- this
    event_min_cells: 10
    h3_max_median_diff_days: -5        # median over events of median(SIF/APAR - NDVI or EVI) <= -5, CI below 0
  bootstrap_n: 2000
  decision: "positive if H3 and (H1 or H2) in the shrubland stratum, each against NDVI and against EVI"
  out_dir: data/processed/drought_q1
  fig_dir: figures/drought_q1

random_seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  fires: data/fires
  figures: figures
